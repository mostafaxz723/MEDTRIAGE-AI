services:
  medtriage-web:
    build: .
    container_name: medtriage_web_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - PORT=8501
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  medtriage-api:
    build: .
    container_name: medtriage_api_service
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
